# Dependabot (frostyard/core ADR-0071 row B13): each go.mod and the actions the
# workflows pin. Each entry has 1 group with `patterns: ["*"]`, so each entry
# opens at most 1 version-update PR for each run (ADR-0075). The group has no
# `applies-to`, so security updates stay 1 PR each. A MyGo bump needs a read of
# its source first (AGENTS.md, "Dependencies").
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      gomod:
        patterns: ["*"]

  # workspaceui, the NSGo kit, is a module of its own (ADR-0014). An NSGo bump
  # needs a read of its release notes first (docs/design/workspaceui.md).
  - package-ecosystem: "gomod"
    directory: "/workspaceui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      gomod-workspaceui:
        patterns: ["*"]

  # The gallery of the NSGo kit, an app with a module of its own.
  - package-ecosystem: "gomod"
    directory: "/workspaceui/gallery"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      gomod-workspaceui-gallery:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
