# Dependabot (frostyard/core ADR-0071 row B13): go.mod and the actions the
# workflows pin. Each entry has 1 group with `patterns: ["*"]`, so each entry
# opens at most 1 version-update PR for each run (ADR-0075). The group has no
# `applies-to`, so security updates stay 1 PR each. A MyGo bump needs a read of
# its source first (AGENTS.md, "Dependencies").
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
