# Dependabot (frostyard/core ADR-0089, baseline row B13): one monthly entry
# for each ecosystem. Each catch-all group opens at most 1 version-update PR
# for its ecosystem per month (ADR-0075). The groups have no `applies-to`, so
# security updates stay immediate and ungrouped. Before merging a MyGo bump,
# read its source (AGENTS.md, "MyGo's rules"). Before merging an NSGo bump,
# read its release notes (docs/design/workspaceui.md).
version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/workspaceui"
      - "/workspaceui/gallery"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
